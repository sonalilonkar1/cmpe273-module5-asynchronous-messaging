services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cmpe273-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cmpe273
      RABBITMQ_DEFAULT_PASS: cmpe273
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
